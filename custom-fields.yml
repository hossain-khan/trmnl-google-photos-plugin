# This file contains custom fields for the TRMNL Google Photos Shared Album Plugin
# Polling Configuration: Uses POST method with JSON body for enhanced privacy
# Dev Documentation: https://help.usetrmnl.com/en/articles/10513740-custom-plugin-form-builder
#
# NOTE: In settings.yml, configure polling as:
# polling_url: https://trmnl-google-photos.gohk.xyz/api/photo
# polling_verb: POST
# polling_headers: Content-Type=application/json
# polling_body: |
#   {
#     "album_url": "{{ shared_album_url }}",
#     "enable_caching": "{{ enable_caching }}"
#   }
#
# Legacy GET method (deprecated):
# polling_url: https://trmnl-google-photos.gohk.xyz/api/photo?album_url=##{{ shared_album_url }}&enable_caching=##{{ enable_caching }}
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: images,personal
  description: |
    Google Photos Shared Album brings your cherished memories to your TRMNL device by displaying random photos from your Google Photos shared albums — no sign-in needed.
    <br><br>
    <strong>How It Works:</strong><br>
    1. Create a shared album in Google Photos<br>
    2. Copy the shared album link<br>
    3. Paste it into the plugin settings<br>
    4. Photos automatically appear on your TRMNL device<br>
    5. New random photo displayed every hour or day based on your refresh configuration
    <br><br>
    <strong>Features:</strong><br>
    📸 Random photo selection from your shared albums<br>
    ⏰ Automatic refresh with new random photos<br>
    🎨 Four optimized layouts for all TRMNL device sizes<br>
    📱 Responsive design across all e-ink displays<br>
    🖼️ Display photo metadata
    <br><br>
    <strong>Privacy-First Design:</strong> This plugin prioritizes your privacy - no need to sign in with Google. No cookies, no tracking, and we never save your personal information. 
  github_url: https://github.com/hossain-khan/trmnl-google-photos-plugin
  learn_more_url: https://hossain-khan.github.io/trmnl-google-photos-plugin/
  email_address: trmnl@hossain.dev
- keyname: shared_album_url
  field_type: url
  name: Google Photos Shared Album URL
  description: "Paste your Google Photos shared album link (e.g., https://photos.app.goo.gl/ABC123)"
  placeholder: "https://photos.app.goo.gl/..."
  default: ""
  optional: true
  help_text: To create a shared album, open Google Photos → Create → Shared Album → Get Link. Ensure link sharing is enabled. Leave blank to see a demo photo.
- keyname: custom_title
  field_type: string
  name: Display Name
  description: "Custom name to show in the title bar (optional)"
  placeholder: "My Google Photos"
  default: ""
  optional: true
  help_text: This name appears in the plugin's title bar. Leave blank to use the plugin name (Google Photos Shared Album).
- keyname: show_year
  field_type: boolean
  default: true
  optional: true
  name: Show Photo Year
  description: "Display the photo year in the bottom right corner"
  help_text: When enabled, the year from the photo's date appears in the bottom right corner with a white stroke for visibility. Disable if you prefer a cleaner photo display.
- keyname: show_metadata
  field_type: boolean
  default: true
  optional: true
  name: Show Photo Details
  description: "Display photo date, size, and count in the title bar"
  help_text: When enabled, shows photo details like date, size, and total count (e.g., '2 years ago • 12MP • 142 photos'). When disabled, only shows photo count for a cleaner look.
- keyname: enable_caching
  field_type: boolean
  default: true
  optional: true
  name: Enable Performance Caching
  description: "Save photo information temporarily for faster loading (recommended)"
  help_text: When enabled, we temporarily remember which photos are in your album for 24 hours so everything loads instantly. Your actual photos are never saved - we just remember they exist. Disable this to always fetch fresh photos directly from Google (takes a few seconds longer, but nothing is saved).
