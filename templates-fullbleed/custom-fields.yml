# TRMNL Google Photos Canvas Plugin — Custom Fields
# For distraction-free, fullscreen photo display (no metadata, no captions)
# Polling Configuration: Uses POST method with JSON body for enhanced privacy
# Dev Documentation: https://help.usetrmnl.com/en/articles/10513740-custom-plugin-form-builder
#
# NOTE: In settings.yml, configure polling as:
# polling_url: https://trmnl-google-photos.gohk.xyz/api/photo
# polling_verb: POST
# polling_headers: Content-Type=application/json
# polling_body: |
#   {
#     "album_url": "{{ shared_album_url }}",
#     "enable_caching": "{{ enable_caching }}",
#     "adaptive_background": "{{ adaptive_background }}"
#   }
#
# Legacy GET method (deprecated):
# polling_url: https://trmnl-google-photos.gohk.xyz/api/photo?album_url=##{{ shared_album_url }}&enable_caching=##{{ enable_caching }}&adaptive_background=##{{ adaptive_background }}

- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: images,personal
  description: |
    <strong>TRMNL Google Photos Canvas</strong> displays your Google Photos shared album in a clean, immersive, fullscreen layout — no captions, no metadata, just your photos edge to edge.
    <br><br>
    <strong>How It Works:</strong><br>
    1. Create a shared album in Google Photos<br>
    2. Copy the shared album link<br>
    3. Paste it below in the recipe settings<br>
    4. Enjoy a new random photo every hour or day (based on your TRMNL refresh settings)
    <br><br>
    <strong>Features:</strong><br>
    🖼️ Fullscreen, distraction-free photo display<br>
    🌈 Adaptive background color based on image being displayed (optional)<br>
    ⚡ Fast loading with optional caching<br>
    🔒 No sign-in, no tracking, privacy-first
  github_url: https://github.com/hossain-khan/trmnl-google-photos-plugin
  learn_more_url: https://hossain-khan.github.io/trmnl-google-photos-plugin/
  email_address: trmnl@hossain.dev
- keyname: shared_album_url
  field_type: url
  name: Google Photos Shared Album URL
  description: "Paste your Google Photos shared album link (e.g., https://photos.app.goo.gl/ABC123)"
  placeholder: "https://photos.app.goo.gl/..."
  default: ""
  optional: false
  help_text: "To create a shared album: Google Photos → Create → Shared Album → Get Link. Make sure link sharing is enabled. Leave blank to see a demo photo."
- keyname: adaptive_background
  field_type: boolean
  default: true
  optional: true
  name: Adaptive Background
  description: "Match background color to photo edge for seamless display"
  help_text: "When enabled, the background shade adapts to each photo for a more immersive look. Adds ~100-200ms to loading. Disable for pure white background."
- keyname: enable_caching
  field_type: boolean
  default: true
  optional: true
  name: Enable Performance Caching
  description: "Cache photo info for faster loading"
  help_text: "When enabled, the plugin remembers your album's photos for 24 hours for instant loading. No actual photos are stored. Disable for always-fresh photos (slower)."
